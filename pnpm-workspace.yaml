# Refuse to install on a Node version outside package.json "engines" (the
# runtime Vercel deploys with; .nvmrc pins the same major for CI and local).
engineStrict: true
allowBuilds:
  "@sentry/cli": true
  esbuild: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
overrides:
  tmp@<0.2.6: ">=0.2.6"
  uuid@<11.1.1: ">=11.1.1"
  # puppeteer-core pins @puppeteer/browsers 2.x, which pulls extract-zip <=2.0.1
  # (GHSA-jmr9-qjv8-65gv, GHSA-7pqw-9j4j-h8q3; no patched release). 3.x drops it.
  "@puppeteer/browsers": "3.2.0"
  qs@<6.16.0: ">=6.16.0 <7.0.0"
  basic-ftp@<6.2.1: ">=6.2.1 <7.0.0"
  # js-yaml 3 only uses argparse in its CLI bin (never run here); argparse 2
  # drops the unpatched sprintf-js (GHSA-hp3w-g68c-fv3c).
  "js-yaml@3>argparse": "^2.0.1"
  # @tailwindcss/typography pins postcss-selector-parser 6.0.10 exactly
  # (GHSA-rj75-hqrm-r3gf); 7.1.6 is the first patched release.
  "@tailwindcss/typography>postcss-selector-parser": "^7.1.6"
peerDependencyRules:
  allowedVersions:
    "@opentelemetry/api": ">=1.0.0 <2.0.0"
    next: ^16.0.0
  ignoreMissing:
    - "@opentelemetry/api@>1.5.0"
    - next@>13
auditConfig:
  ignoreGhsas:
    # braces <=3.0.3 stack-exhaustion DoS on deeply nested patterns. No
    # patched release exists (advisory lists none; 3.0.3 is latest on npm).
    # Only reachable via fast-glob/micromatch in build/dev tooling
    # (@next/eslint-plugin-next, a devDependency), which expands patterns from
    # repo config — never from request input — so it is not exploitable here.
    # Remove once braces ships a fix. Accepted 2026-10-19; see
    # docs/SECURITY_POLICY.md "Accepted dependency advisories".
    - GHSA-vfj7-8cjw-p6xm
