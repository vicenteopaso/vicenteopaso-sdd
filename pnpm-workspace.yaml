allowBuilds:
  "@sentry/cli": true
  esbuild: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
overrides:
  tmp@<0.2.6: ">=0.2.6"
  uuid@<11.1.1: ">=11.1.1"
  "@puppeteer/browsers": "3.2.0"
  axios@<1.20.0: ">=1.20.0 <2.0.0"
  ip-address@<10.7.1: ">=10.7.1 <11.0.0"
  qs@<6.16.0: ">=6.16.0 <7.0.0"
peerDependencyRules:
  allowedVersions:
    "@opentelemetry/api": ">=1.0.0 <2.0.0"
    next: ^16.0.0
  ignoreMissing:
    - "@opentelemetry/api@>1.5.0"
    - next@>13
